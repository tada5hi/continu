<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="continu-a-title continu-a-desc">
<title id="continu-a-title">Continu — The checked drawer</title>
<desc id="continu-a-desc">A three-drawer value cabinet accepts a checked value, while a lower drawer holds a fallback.</desc>
<style>
:root{--accent:#cf7831;--second:#526ba4;--ink:#253447;--paper:#f7fafc;--line:#8394a7;--wash:#cf783118}
@media(prefers-color-scheme:dark){:root{--ink:#e4ebf3;--paper:#182332;--line:#8495aa;--wash:#cf783122}}
.a{stroke:var(--accent)}.b{stroke:var(--second)}.af{fill:var(--accent)}.bf{fill:var(--second)}.ink{fill:var(--ink)}.paper{stroke:var(--line)}.line{stroke:var(--line)}.wash{fill:var(--wash)}.white{fill:#fff}.neutral{fill:var(--paper)}
</style>
